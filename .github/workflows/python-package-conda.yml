name: Portfolio structure and bundled-data checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas pytest
      - run: python -m compileall -q bank-churn-analysis fraud-detection-finance heart-disease-prediction public-health-sentiment toronto-311-analysis
      - run: python -m pytest -q tests/
