name: Real ULB anonymized credit-card fraud source-to-heldout model
on:
  push:
    branches: [main]
    paths:
      - "fraud-detection-finance/run_real_ulb_fraud.py"
      - "fraud-detection-finance/analyze_fraud_costs.py"
      - "fraud-detection-finance/tests/test_fraud_cost_sensitivity.py"
      - "fraud-detection-finance/notebooks/fraud_detection.py"
      - ".github/workflows/real-ulb-fraud.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-ulb-fraud-research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install genuine OpenML source and evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<3" pandas "scikit-learn>=1.5,<1.9" matplotlib scipy
      - name: Download original labeled ULB 2013 card transactions through OpenML, fit and evaluate
        run: python -u fraud-detection-finance/notebooks/fraud_detection.py
      - name: Independently check untouched test artifact, fraud counts, models and source
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          import pandas as pd
          root=Path("fraud-detection-finance/results/ulb_real_fraud")
          data=json.loads((root/"verified_results.json").read_text())
          a=data["data_contract"]; split=data["split"]
          assert data["openml_dataset_id"] == 1597
          assert a["original_rows"] == 284807 and a["original_positive_labels"] == 492
          assert a["original_rows_preserved"] == 284807 and a["original_fraud_labels_preserved"] == 492
          assert a["repeated_anonymized_feature_vectors_grouped_across_splits"] >= 0
          assert not a["time_field_available_from_openml"]
          assert len(a["source_numeric_values_sha256"]) == 64
          assert split["train_rows"] + split["validation_rows"] + split["test_rows"] == a["original_rows_preserved"]
          assert split["train_fraud"]+split["validation_fraud"]+split["test_fraud"] == a["original_fraud_labels_preserved"]
          assert 50000 <= split["test_rows"] <= 60000
          assert set(data["models"]) == {"class_prior_baseline","balanced_logistic_regression","histogram_gradient_boosting"}
          assert data["selected_model"] in ("balanced_logistic_regression","histogram_gradient_boosting")
          observed=pd.read_csv(root/"heldout_real_ulb_probabilities.csv")
          assert len(observed) == split["test_rows"]
          assert observed["original_openml_row_position"].is_unique
          assert int(observed["original_fraud_label"].sum()) == split["test_fraud"]
          for model, result in data["models"].items():
              probs=observed["probability_"+model]
              assert probs.notna().all() and probs.between(0,1).all()
              scores=result["untouched_test"]
              assert 0 <= result["validation_average_precision"] <= 1
              assert 0 <= result["threshold_selected_on_validation_only"] <= 1
              assert all(math.isfinite(scores[k]) and 0 <= scores[k] <= 1
                         for k in ("roc_auc","average_precision_pr_auc","precision_fraud","recall_fraud","f1_fraud"))
              assert sum(map(sum,scores["confusion_matrix_true_0_1"])) == split["test_rows"]
          assert (root/"heldout_precision_recall.png").read_bytes()[:8] == bytes.fromhex("89504e470d0a1a0a")
          print("REAL FRAUD AUDIT PASS: all 284807 original source rows, identical-observation group leak guard, three fitted classifiers and isolated validation/test.")
          PY
      - name: Test post-hoc cost accounting without test-threshold tuning
        run: |
          python -m unittest discover -s fraud-detection-finance/tests -p 'test_fraud_cost_sensitivity.py' -v
      - name: Recompute frozen-threshold false alerts and missed frauds under explicit hypothetical costs
        run: python -u fraud-detection-finance/analyze_fraud_costs.py
      - name: Independently verify fixed-threshold cost sensitivity artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("fraud-detection-finance/results/ulb_real_fraud")
          report = json.loads((root/"verified_results.json").read_text())
          result = json.loads((root/"frozen_threshold_cost_sensitivity.json").read_text())
          assert result["selected_model"] == report["selected_model"]
          assert result["n_test"] == report["split"]["test_rows"]
          assert result["actual_fraud_labels"] == report["split"]["test_fraud"]
          assert not result["threshold_or_model_tuned_using_holdout_labels"]
          assert result["assumptions_not_observed_loss_or_operational_savings"]
          chosen = report["models"][result["selected_model"]]
          cm = chosen["untouched_test"]["confusion_matrix_true_0_1"]
          tn, fp, fn, tp = result["actual_selected_threshold_tn_fp_fn_tp"]
          assert cm == [[tn, fp], [fn, tp]]
          for scenario in result["hypothetical_cost_scenarios"].values():
              m = scenario["assumed_cost_missed_fraud"]
              f = scenario["assumed_cost_false_positive_alert"]
              assert scenario["never_flag_anything_hypothetical_cost"] == (fn+tp)*m
              assert scenario["validation_threshold_alert_policy_hypothetical_cost"] == fn*m + fp*f
              assert scenario["illustrative_difference_vs_never_flagging"] == tp*m - fp*f
          print("Verified frozen validation-policy FP/FN and purely hypothetical cost assumptions.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: actual-ULB-2013-fraud-train-validation-test-results
          path: fraud-detection-finance/results/ulb_real_fraud/
          if-no-files-found: error
