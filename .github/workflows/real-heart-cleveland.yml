name: Real UCI Cleveland heart-disease research lifecycle

on:
  push:
    branches: [main]
    paths:
      - "heart-disease-prediction/**"
      - ".github/workflows/real-heart-cleveland.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observed-uci-heart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research data and evaluation dependencies
        run: python -m pip install numpy pandas scikit-learn matplotlib
      - name: Retrieve genuine UCI Cleveland observations, train and evaluate
        run: python heart-disease-prediction/run_verified_cleveland.py
      - name: Verify empirical source, splits, output metrics and plot
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          target = Path("heart-disease-prediction/results")
          x = json.loads((target / "verified_results.json").read_text())
          assert x["source"] == "https://archive.ics.uci.edu/ml/machine-learning-databases/heart-disease/processed.cleveland.data"
          assert x["original_records"] == 303 and x["input_features"] == 13
          assert x["missing_feature_cells"] > 0
          assert len(x["raw_sha256"]) == 64
          assert 100 <= x["positive_original_records"] <= 200
          assert x["split"]["train_rows"] + x["split"]["test_rows"] == 303
          assert x["split"]["test_rows"] >= 90
          assert set(x["model_metrics"]) == {"Prior-prevalence baseline", "KNN k=5", "Random Forest"}
          for result in x["model_metrics"].values():
              for name in ("test_accuracy", "test_balanced_accuracy", "test_roc_auc", "test_average_precision"):
                  assert math.isfinite(result[name]) and 0 <= result[name] <= 1
              cm = result["test_confusion_matrix"]
              assert len(cm) == 2 and all(len(row) == 2 for row in cm)
              assert sum(map(sum, cm)) == x["split"]["test_rows"]
          assert (target / "heldout_roc.png").read_bytes()[:8] == bytes.fromhex("89504e470d0a1a0a")
          print("Verified: original 303 UCI Cleveland rows, genuine missingness, training-only imputation, all held-out results and ROC figure")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: genuine-uci-cleveland-train-heldout-evidence
          path: |
            heart-disease-prediction/results/verified_results.json
            heart-disease-prediction/results/heldout_roc.png
          if-no-files-found: error
