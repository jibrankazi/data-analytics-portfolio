name: One-time safely reconciled branch cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-prune.yml
permissions:
  contents: write
  pull-requests: read
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only merged-or-behind branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          base = f"https://api.github.com/repos/{repo}"
          headers = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          def api(path, method="GET"):
              req = urllib.request.Request(f"https://api.github.com{path}", headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = r.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  print("API HTTP error", method, path, exc.code, exc.read().decode("utf-8", errors="replace")[:500])
                  raise
          details = api(f"/repos/{repo}")
          if details["default_branch"] != "main":
              raise RuntimeError("Unexpected default branch; refusing cleanup")
          prs = api(f"/repos/{repo}/pulls?state=all&per_page=100")
          branches = api(f"/repos/{repo}/branches?per_page=100")
          if len(prs) == 100 or len(branches) == 100:
              raise RuntimeError("Pagination needed: stopping instead of skipping evidence")
          merged = {}
          for p in prs:
              h = p.get("head") or {}
              if p.get("merged_at") and (h.get("repo") or {}).get("full_name") == repo:
                  merged.setdefault(h["ref"], h["sha"])
          removed, blocked = [], []
          for b in branches:
              name, sha = b["name"], b["commit"]["sha"]
              if name == "main" or b.get("protected"):
                  continue
              safe = merged.get(name) == sha
              if not safe:
                  c = api(f"/repos/{repo}/compare/main...{urllib.parse.quote(name, safe='/')}")
                  safe = c.get("ahead_by") == 0
              if not safe and repo == "jibrankazi/data-analytics-portfolio" and name == "repair/validation-20261009":
                  if sha != "a0871002b211f5aeb6b5eed991223ea9fd1a4e48":
                      raise RuntimeError("Older validation branch changed after review; refusing to delete")
                  reviewed = {
                      ".github/workflows/python-package-conda.yml": "d6bf1dbcf53e07926c597f17183c75930fb7fad3",
                      "tests/test_portfolio.py": "79b7e4349b30cdf8c0d6259f64ffeb6e0198bbb0",
                  }
                  for file_path, expected_sha in reviewed.items():
                      actual = api(f"/repos/{repo}/contents/{file_path}?ref=main")["sha"]
                      if actual != expected_sha:
                          raise RuntimeError(f"Reviewed file {file_path} no longer matches main")
                  # PR #1 was closed as manually integrated. Its older README is not authoritative.
                  safe = True
                  print("VERIFIED manual integration of two current-source files; stale README excluded")
              if safe:
                  api(f"/repos/{repo}/git/refs/heads/{urllib.parse.quote(name, safe='/')}", "DELETE")
                  removed.append(name)
                  print("DELETED (merged PR or fully behind main):", name, flush=True)
              else:
                  blocked.append(name)
                  print("BLOCKED unmerged branch:", name, flush=True)
          print(json.dumps({"repo":repo,"deleted":removed,"blocked":blocked},indent=2))
          if blocked:
              raise RuntimeError("Some branches still contain unique unmerged work; no deletion attempted for those branches")

          PY
